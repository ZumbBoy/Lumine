<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <header class="top-header">
    <a class="logo" href="Main.html">Lumine</a>
    <nav class="nav-menu">
      
      <a href="Main.html">Voltar</a>
    </nav>
  </header>
  <main class="agendamento-container">
    <h2 style="text-align: center;">Agendamento</h2>
    <form class="booking-form">
  <!-- 1. Seleção do Serviço -->
  <div class="form-group">
    <label for="servico">Serviço Desejado</label>
    <select id="servico" name="servico" required>
      <option value="" disabled selected>Selecione um serviço...</option>
      <option value="corte">Corte e Escova</option>
      <option value="coloracao">Coloração / Luzes</option>
      <option value="manicure">Manicure e Pedicure</option>
      <option value="estetica">Design de Sobrancelhas / Maquiagem</option>
    </select>
  </div>

  <!-- 2. Seleção da Data -->
  <div class="form-group">
    <label for="data">Data do Atendimento</label>
    <input type="date" id="data" name="data" required>
  </div>

  <!-- 3. Seleção do Horário -->
  <div class="form-group">
    <label for="horario">Horário Disponível</label>
    <select id="horario" name="horario" required>
      <option value="" disabled selected>Escolha um horário...</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="13:00">13:00</option>
      <option value="14:00">14:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
      <option value="17:00">17:00</option>
    </select>
  </div>

  <!-- Botão de Confirmação -->
  <button type="submit" class="btn-primary">Confirmar Agendamento</button>
</form>
  </main>
</body>
</html>
