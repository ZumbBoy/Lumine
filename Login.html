<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumine</title>
    <link rel="stylesheet" href="CSS/estilo.css">
</head>

<body>
  
   <main class="login-container">
  <h2 style="text-align: center;">Login</h2>
  <form>
    <div class="input-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>
    </div>

    <div class="input-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
    </div>

    <button type="button" onclick="window.location.href='Main.html' ">Entrar</button>
    <a href="Cadastro.html" class="btn-secundario">Cadastre-se</a>
  </form>

  <div class="divider">
    <span>Ou acesse com</span>
  </div>

  <div class="social-login">
    <button type="button" class="btn-google">
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo" class="icon-google">
        Entrar com o Google
    </button>
  </div>
</main>

</body>
</html>
